name: Validate CanadaCase
on:
  push:
    branches:
      - main
      - feature/canadacase-delivery-2026-11
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Check unique account registration and expandable candidate directory
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          for (const marker of ['toLowerCase()', 'data.user.identities.length === 0', 'academy_user_roles', 'rolesByUser', 'admin-person-details-row', 'admin-nested-cases', 'Réinitialiser mot de passe']) {
            if (!app.includes(marker)) throw new Error('Missing candidate account behavior: ' + marker);
          }
          for (const marker of ['admin-people-table', 'Fonctions', 'Dossiers', 'id="clients-table"']) {
            if (!html.includes(marker)) throw new Error('Missing candidate directory table: ' + marker);
          }
          for (const selector of ['.admin-people-table', '.admin-role-chip', '.admin-person-details', '.admin-nested-cases']) {
            if (!css.includes(selector)) throw new Error('Missing candidate directory style: ' + selector);
          }
          console.log('Email normalization, duplicate-signup response, multi-role candidate list and expandable case table validated');
          NODE
      - name: Check oral coach conversational flow
        run: |
          node --check assets/academy-coach.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('academy-coach.html', 'utf8');
          const js = fs.readFileSync('assets/academy-coach.js', 'utf8');
          const edge = fs.readFileSync('supabase/functions/language-coach/index.ts', 'utf8');
          for (const marker of ['@supabase/supabase-js@2', 'assets/config.js', 'assets/academy-coach.js']) {
            if (!html.includes(marker)) throw new Error('Coach page missing dependency: ' + marker);
          }
          for (const marker of ['sb.auth.getSession()', 'sb.functions.invoke("language-coach"', 'action: "chat"', 'SpeechRecognition', 'speechSynthesis', 'const recentHistory = history.slice(-60)', 'while (recentHistory.length && recentHistory[0].role !== "user")', 'async function startMediaRecording()', 'action: \'transcribe\'', 'new MediaRecorder', 'Priorité à la reconnaissance vocale en direct', 'sans limite de durée', 'history.slice(-60)', 'Connectez-vous d\'abord', 'function taskTiming()', 'fullExamMode', 'examDeadlineAt', 'Temps total restant', 'function beginPhase(index', 'phaseIndex < tasks[exam].length - 1', 'Simulation complète', 'prepSeconds: 120', 'interactionSeconds: 210', 'endExamByTimer()', 'timeExpired', 'finishAndReview(true)', 'seconds: index === 0 ? 300 : 600', 'seconds: 270']) {
            if (!js.includes(marker)) throw new Error('Coach front end missing behavior: ' + marker);
          }
          for (const marker of ['body.action === "chat"', 'provider: "Google Gemini"', 'AI_TEMPORARILY_UNAVAILABLE', 'GEMINI_NOT_CONFIGURED', 'NOTE PÉDAGOGIQUE INDICATIVE SUR 20', 'Interaction et respect de la consigne /5', 'Maîtrise grammaticale et syntaxique /5']) {
            if (!edge.includes(marker)) throw new Error('Coach Edge Function missing behavior: ' + marker);
          }
          for (const marker of ['async function loadCoachHistory()', 'async function saveCoachSession(feedback)', 'from("language_attempts")', '.is("exercise_id", null)', '.limit(10)', 'Mon carnet de progression']) {
            if (!js.includes(marker) && !html.includes(marker)) throw new Error('Coach progress notebook missing behavior: ' + marker);
          }
          if (js.includes('level: "B2"')) throw new Error('Coach must not assign an unverified B2 level.');
          for (const marker of ['coach-history-list', 'academy-coach.css?v=20261119-04', 'academy-coach.js?v=20261119-06']) {
            if (!html.includes(marker)) throw new Error('Coach page missing updated notebook assets: ' + marker);
          }
          console.log('Oral coach authentication, AI conversation, voice fallback and progress notebook checks passed');
          NODE
      - name: Check Academy mock exams and certificate interface
        run: |
          node --check assets/academy-exams.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('academy-exams.html', 'utf8');
          const js = fs.readFileSync('assets/academy-exams.js', 'utf8');
          const css = fs.readFileSync('assets/academy-exams.css', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          if (ids.some((id, i) => ids.indexOf(id) !== i)) throw new Error('Duplicate IDs on exam page');
          for (const marker of ['id="certificate-verify-form"', 'id="exam-app"', 'academy-exams.js']) {
            if (!html.includes(marker)) throw new Error('Missing exam page element: ' + marker);
          }
          for (const marker of ['academy_start_mock_exam', 'academy_submit_mock_exam', 'academy_admin_save_exam_question', 'academy_admin_grade_mock_exam', 'academy_verify_certificate', 'awaiting_review', 'requires_entitlement', 'SpeechSynthesisUtterance', 'speechSynthesis', 'exam-clock', 'setInterval', 'started_at', 'data-play-audio', 'MediaRecorder', 'getUserMedia', 'language-recordings', 'createSignedUrl', 'audio_path', 'recordingUploads', 'academy_mock_exam_reviewers', 'trainerPanel', 'assignReviewer', 'academy_list_stale_mock_exam_recordings', 'buildSectionGroups', 'advanceSection', 'exam-section-clock', 'data-next-section', 'sectionTimeExpired', 'function printCertificate', 'Certificate of Achievement', 'qrcodejs', '?verify=', 'learner_name_snapshot', 'participationAdminPanel', 'academy_admin_issue_participation_attestation', 'academy_admin_revoke_participation_attestation', 'academy_participation_attestations', 'Certificate of Participation', '"CO":35', '"CE":60', '"EE":60', '"EO":12', '"CO":40', '"EO":15']) {
            if (!js.includes(marker)) throw new Error('Missing mock exam behavior: ' + marker);
          }
          if (!html.includes('noindex,nofollow')) throw new Error('Authenticated exam page must not be indexed');
          if (!css.includes('.exam-panel') || !css.includes('.exam-question') || !css.includes('.exam-clock') || !css.includes('.exam-audio-controls') || !css.includes('.exam-recording-controls') || !css.includes('.exam-section-clock') || !css.includes('.exam-section-heading')) throw new Error('Missing exam interface styles');
          for (const page of ['academy.html', 'academy-dashboard.html', 'academy-catalog.html', 'academy-bookings.html', 'academy-payments.html']) {
            if (!fs.readFileSync(page, 'utf8').includes('academy-exams.html')) throw new Error('Missing exam navigation in ' + page);
          }
          for (const marker of ['academy_mock_exam_reviewers', 'trainerPanel', 'assignReviewer', 'academy_list_stale_mock_exam_recordings', 'buildSectionGroups', 'advanceSection', 'exam-section-clock', 'data-next-section']) { if (!js.includes(marker)) throw new Error('Missing trainer/section timer feature: ' + marker); }
          if (!js.includes('data-unassign-reviewer') || !js.includes('academy_mock_exam_reviewers') || !js.includes('academy_list_stale_mock_exam_recordings')) throw new Error('Missing trainer assignment or stale audio cleanup UI');
          if (!js.includes('"CO":35') || !js.includes('"CE":60') || !js.includes('"EE":60') || !js.includes('"EO":12') || !js.includes('"CO":40') || !js.includes('"EO":15')) throw new Error('Missing official TCF/TEF section time allocations');
          console.log('Academy exam, manual review, certificate verification and navigation checks passed');
          NODE
      - name: Check Academy interactive language exercise library
        run: |
          node --check assets/academy-catalog.js
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('assets/academy-catalog.js', 'utf8');
          const css = fs.readFileSync('assets/academy-catalog.css', 'utf8');
          for (const marker of ['language_exercises', 'language_exercise_questions', 'data-open-exercise', 'exercise-attempt-form', 'language_submit_exercise_attempt', 'exerciseResult', 'corrections', 'provenance_type', 'source_name', 'source_url', 'exerciseOriginLabel', 'Source non vérifiée — statut officiel non établi', 'ne permet pas de présenter un exercice comme un sujet officiel', 'x.exam==="TCF & TEF Canada"', 'value="link_only"', 'Ressources officielles et complémentaires']) {
            if (!js.includes(marker)) throw new Error('Missing exercise library feature: ' + marker);
          }
          if (js.includes('language_question_keys')) throw new Error('Answer keys must never be fetched by the browser');
          for (const marker of ['.exercise-option', '#exercise-attempt-form fieldset', '#exercise-detail .lesson-content']) {
            if (!css.includes(marker)) throw new Error('Missing exercise library style: ' + marker);
          }
          console.log('Interactive exercise catalogue and server-side correction checks passed');
          NODE
      - name: Check required application elements and course workflow
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const js=fs.readFileSync('assets/app.js','utf8'); for (const id of ['candidate-form','active-case-select','create-case','password-form','admin-view','language-courses-list','language-course-view','language-course-form','language-courses-admin','course-library-exam','course-library-skill']) { if (!h.includes('id=\\\"'+id+'\\\"')) throw new Error('Missing '+id); } for (const marker of ['loadPublishedLanguageCourses','loadAdminLanguageCourses','language-course-form','course-library-exam']) { if (!js.includes(marker)) throw new Error('Missing course workflow: '+marker); } console.log('Required UI elements and methodology course workflow present');"
      - name: Check exam selection, media and oral recording flow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + duplicates.join(', '));
          if (html.includes('id="mock-training-exam"') || js.includes('#mock-training-exam')) throw new Error('Mock exam must reuse the selected exam');
          for (const asset of ['assets/tcf-canada-illustration.svg', 'assets/tef-canada-illustration.svg']) {
            if (!html.includes(asset) || !fs.existsSync(asset)) throw new Error('Missing exam illustration: ' + asset);
          }
          for (const marker of ['setupRecordingControls("mock-")', 'audio-played-note', 'mock-recording-controls', 'const exam = $("#training-exam").value', 'if (exam === "TEF Canada" && skill === "Compréhension orale")', 'const singlePlay = inMock && activeSkill === "Compréhension orale"', 'if (inMock && exercise.skill === "Compréhension orale")', 'audio.controls = false', '▶ Réécouter le document audio', 'Enregistrement diffusé une seule fois dans cette simulation.']) {
            if (!js.includes(marker)) throw new Error('Missing mock/audio behavior: ' + marker);
          }
          if (!css.includes('.language-exam-cover') || !css.includes('.mock-recording-controls')) throw new Error('Missing responsive visual styles');
          console.log('Selected exam, illustrations, oral recording and audio playback checks passed');
          NODE
      - name: Check HeyGen audio migration and administrator playback controls
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const fn = fs.readFileSync('supabase/functions/sync-language-audio/index.ts', 'utf8');
          for (const marker of ['id="sync-language-audio"', 'sync-language-audio', 'Copier les audios HeyGen dans Supabase Storage']) {
            if (!html.includes(marker) && !app.includes(marker)) throw new Error('Missing audio import UI: ' + marker);
          }
          for (const marker of ['SUPABASE_SERVICE_ROLE_KEY', 'auth.getUser()', 'profile?.role !== "admin"', 'resource2.heygen.ai', 'admin.storage.from("language-media").upload', 'update({ audio_path: storagePath })']) {
            if (!fn.includes(marker)) throw new Error('Missing secure audio migration behavior: ' + marker);
          }
          for (const marker of ['const singlePlay = inMock && activeSkill === "Compréhension orale"', 'audio.controls = false', '▶ Réécouter le document audio']) {
            if (!app.includes(marker)) throw new Error('Missing listening playback behavior: ' + marker);
          }
          console.log('Secure HeyGen audio migration, training replay and mock single-play behavior validated');
          NODE
      - name: Check interactive QCM practice and production task coverage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          for (const id of ['training-questions', 'training-answer', 'correct-training-answer']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing practice element: ' + id);
          }
          for (const marker of ['gradePracticeQuestionSet', 'language_exercise_questions', 'grade-language-attempt', 'question_ids: questions.map', 'getProductionTaskCoverage', 'productionCoverage.complete', 'const hasSectionA = ']) {
            if (!js.includes(marker)) throw new Error('Missing learning/exam behavior: ' + marker);
          }
          if (!js.includes('Réponse attendue : ') || !js.includes('Explication : ')) throw new Error('Missing detailed QCM correction output');
          if (!css.includes('.practice-qcm-form') || !css.includes('.practice-qcm-result')) throw new Error('Missing QCM practice styles');
          console.log('Interactive QCM, saved corrections and production task coverage checks passed');
          NODE
      - name: Check full-length mixed-level mock exam coverage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'const mixedLevelMock = inMock && isQcm',
            'exerciseQuery.in("level", ["B2", "C1", "C2"])',
            'count:39,minutes:35',
            'count:39,minutes:60',
            'count:40,minutes:40',
            'count:40,minutes:60',
            'questions B2–C2'
          ];
          for (const item of required) {
            if (!app.includes(item) && !html.includes(item)) throw new Error('Missing full mock coverage behavior: ' + item);
          }
          if (!html.includes('<option selected>B2</option><option>C1</option><option>C2</option>')) {
            throw new Error('Mock exam level selector is not restricted to the available B2-C2 bank');
          }
          console.log('TCF 39-question and TEF 40-question full mock settings validated');
          NODE
      - name: Check AI correction fallback configuration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fn = fs.readFileSync('supabase/functions/language-coach/index.ts', 'utf8');
          for (const model of ['gemini-3.5-flash-lite', 'gemini-3.6-flash', 'gemini-3.8-flash']) {
            if (!fn.includes(model)) throw new Error('Missing supported Gemini fallback: ' + model);
          }
          for (const legacy of ['"gemini-2.5-flash"', '"gemini-2.5-flash-lite"']) {
            if (fn.includes(legacy)) throw new Error('Legacy Gemini model must not be configured: ' + legacy);
          }
          for (const marker of ['for (const model of MODELS.slice(0, 3))', 'AbortSignal.timeout(timeoutMs)', 'response.status === 401 || response.status === 403', 'maxOutputTokens']) {
            if (!fn.includes(marker)) throw new Error('Missing AI reliability behavior: ' + marker);
          }
          if (!fn.includes('Bearer' + String.fromCharCode(92) + 's+')) throw new Error('Missing bearer-token validation');
          console.log('Gemini model fallback, per-model timeout and authorization checks passed');
          NODE
      - name: Check Cloudflare Worker deployment configuration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const ignore = fs.readFileSync('.assetsignore', 'utf8');
          if (config.name !== 'canadacase') throw new Error('Cloudflare Worker name must be canadacase');
          if (config.assets?.directory !== '.') throw new Error('Cloudflare assets directory must be repository root');
          if (pkg.devDependencies?.wrangler !== '4.68.0') throw new Error('Wrangler must remain pinned to the verified version');
          if (!pkg.scripts?.deploy?.includes('wrangler deploy')) throw new Error('Missing Wrangler deploy script');
          for (const entry of ['.github/', 'supabase/', 'node_modules/', 'package.json', 'wrangler.jsonc']) {
            if (!ignore.includes(entry)) throw new Error('Missing Cloudflare asset exclusion: ' + entry);
          }
          for (const asset of ['index.html', 'assets/config.js', 'assets/app.js', 'assets/style.css']) {
            if (!fs.existsSync(asset)) throw new Error('Missing public asset: ' + asset);
          }
          console.log('Cloudflare Worker config and public asset exclusions passed');
          NODE
      - name: Validate public SEO pages, robots and sitemap
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const robots = fs.readFileSync('robots.txt', 'utf8');
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const pages = ['tef-canada.html', 'tcf-canada.html', 'immigration-canada.html'];
          const base = 'https://canadacase.meguegap.workers.dev/';
          if (!html.includes('<meta name="description"') || !html.includes('<link rel="canonical" href="' + base + '">')) throw new Error('Homepage SEO metadata missing');
          for (const path of pages) {
            if (!fs.existsSync(path)) throw new Error('Missing public SEO page: ' + path);
            const page = fs.readFileSync(path, 'utf8');
            if (!page.includes('<title>') || !page.includes('<meta name="description"') || !page.includes('rel="canonical"') || page.includes('noindex')) throw new Error('SEO metadata or indexability issue: ' + path);
            if (!sitemap.includes('<loc>' + base + path + '</loc>')) throw new Error('Page missing from sitemap: ' + path);
            if (!html.includes('/' + path)) throw new Error('Homepage does not link to: ' + path);
          }
          if (!robots.includes('Sitemap: ' + base + 'sitemap.xml')) throw new Error('robots.txt sitemap reference missing');
          console.log('Homepage, three public SEO pages, canonical URLs, robots.txt and sitemap validated');
          NODE
      - name: Dry-run Cloudflare static asset deployment
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run deploy -- --dry-run
      - name: Deploy Cloudflare Worker on main when deployment secrets are configured
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Check secure candidate and admin document preview/download
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'function closeDocumentPreview()',
            'async function openDocumentPreview(storagePath, fileName, mimeType)',
            'setAttribute("aria-modal", "true")',
            'event.key === "Escape"',
            'createSignedUrl(storagePath, 600)',
            'type === "application/pdf"',
            'type.startsWith("image/")',
            'L’aperçu intégré n’est pas disponible pour ce format.',
            'window.location.assign(result.signedUrl)',
            'openDocumentPreview(d.storage_path, d.file_name, d.mime_type)',
            'openDocumentPreview(doc.storage_path, doc.file_name, doc.mime_type)',
            '.select("id,category,file_name,storage_path,mime_type,size_bytes,status,created_at")',
            '.select("id,category,file_name,storage_path,mime_type,size_bytes,status,created_at,candidate_case_id")'
          ];
          for (const marker of required) {
            if (!app.includes(marker)) throw new Error('Missing document preview/download behavior: ' + marker);
          }
          for (const selector of ['.document-preview-overlay', '.document-preview-dialog', '.document-preview-frame', '.document-preview-image']) {
            if (!css.includes(selector)) throw new Error('Missing preview style: ' + selector);
          }
          for (const asset of ['assets/app.js?v=20261118-02', 'assets/style.css?v=20261118-02']) {
            if (!html.includes(asset)) throw new Error('Missing cache-busted asset reference: ' + asset);
          }
          console.log('Candidate/admin PDF and image preview, temporary links, download fallback, close controls and responsive styles validated');
          NODE
      - name: Check reading document visibility and grouped audio questions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          for (const marker of ['questionsByExercise', 'exerciseOrder.flatMap', 'skill==="Compréhension écrite"', 'sourceBody.textContent=exercise.prompt', 'renderExamQuestion(question, index, exerciseMap.get(question.exercise_id), seen, skill)']) {
            if (!js.includes(marker)) throw new Error('Missing mock exam document/audio grouping: ' + marker);
          }
          if (!css.includes('.exam-source-text')) throw new Error('Missing readable document styles');
          console.log('Reading documents and grouped audio questions checks passed');
          NODE
      - name: Check TEF/TCF learner progress dashboard
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          for (const id of ['language-home-dashboard', 'language-home-attempts', 'language-home-average', 'language-home-last', 'language-streak-value', 'language-daily-goal-fill', 'language-home-recommendation', 'language-continue-practice', 'language-start-course', 'language-start-mock']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing learner dashboard element: ' + id);
          }
          for (const marker of ['loadLanguageHomeDashboard(exam)', 'language_attempts', 'language-continue-practice', 'language-start-course', 'language-start-mock']) {
            if (!app.includes(marker)) throw new Error('Missing learner dashboard behavior: ' + marker);
          }
          if (!css.includes('.language-home-dashboard') || !css.includes('.language-home-stats')) throw new Error('Missing learner dashboard styles');
          console.log('TEF/TCF learner dashboard, statistics, daily goal and quick actions validated');
          NODE
      - name: Check email confirmation and verified-account access
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          for (const marker of ['emailRedirectTo: window.location.origin + "/"', 'isEmailConfirmed', 'if (data.user?.email && !isEmailConfirmed(data.user))', 'if (currentUser.email && !isEmailConfirmed(currentUser))', 'detectSessionInUrl: true', 'Votre adresse e-mail est confirmée']) {
            if (!app.includes(marker)) throw new Error('Missing email confirmation behavior: ' + marker);
          }
          console.log('Signup redirect, callback handling and verified-email login guards validated');
          NODE
      - name: Check client workspace navigation and dashboard
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          for (const marker of ['id="client-dashboard"', 'data-client-nav="dashboard"', 'data-client-nav="immigration"', 'data-client-nav="documents"', 'data-client-nav="tracking"', 'data-client-nav="language"', 'data-client-nav="security"', 'data-client-section="documents"', 'data-client-section="tracking"', 'data-client-section="language"']) {
            if (!html.includes(marker)) throw new Error('Missing client workspace structure: ' + marker);
          }
          for (const marker of ['function setClientSection(section)', 'candidateView.dataset.clientSection = section', 'setClientSection(workspace === "language" ? "language" : "dashboard")', 'setClientSection(activeWorkspace === "language" ? "language" : "dashboard")']) {
            if (!app.includes(marker)) throw new Error('Missing client navigation behavior: ' + marker);
          }
          for (const selector of ['.client-space-nav', '.client-dashboard-grid', '.client-dashboard-card', '#candidate-view[data-client-section="documents"]']) {
            if (!css.includes(selector)) throw new Error('Missing client workspace style: ' + selector);
          }
          for (const asset of ['assets/app.js?v=20261118-02', 'assets/style.css?v=20261118-02']) {
            if (!html.includes(asset)) throw new Error('Missing updated cache-busted asset: ' + asset);
          }
          console.log('Client dashboard, section navigation, responsive layout and cache-busting validated');
          NODE

      - name: Validate Academy paid-course routing and catalogue navigation
        run: |
          node --check assets/academy-catalog.js
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('assets/academy-catalog.js', 'utf8');
          const html = fs.readFileSync('academy-catalog.html', 'utf8');
          if (js.includes('S’inscrire gratuitement')) throw new Error('Catalogue must not label every course as free');
