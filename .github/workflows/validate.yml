name: Validate CanadaCase
on:
  push:
    branches:
      - main
      - feature/canadacase-delivery-2026-11
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Check required application elements and course workflow
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const js=fs.readFileSync('assets/app.js','utf8'); for (const id of ['candidate-form','active-case-select','create-case','password-form','admin-view','language-courses-list','language-course-view','language-course-form','language-courses-admin','course-library-exam','course-library-skill']) { if (!h.includes('id=\\\"'+id+'\\\"')) throw new Error('Missing '+id); } for (const marker of ['loadPublishedLanguageCourses','loadAdminLanguageCourses','language-course-form','course-library-exam']) { if (!js.includes(marker)) throw new Error('Missing course workflow: '+marker); } console.log('Required UI elements and methodology course workflow present');"
      - name: Check exam selection, media and oral recording flow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + duplicates.join(', '));
          if (html.includes('id="mock-training-exam"') || js.includes('#mock-training-exam')) throw new Error('Mock exam must reuse the selected exam');
          for (const asset of ['assets/tcf-canada-illustration.svg', 'assets/tef-canada-illustration.svg']) {
            if (!html.includes(asset) || !fs.existsSync(asset)) throw new Error('Missing exam illustration: ' + asset);
          }
          for (const marker of ['setupRecordingControls("mock-")', 'audio-played-note', 'mock-recording-controls', 'const exam = $("#training-exam").value', 'if (exam === "TEF Canada" && skill === "Compréhension orale")', 'const singlePlay = inMock && activeSkill === "Compréhension orale"', 'if (inMock && exercise.skill === "Compréhension orale")', 'audio.controls = false', '▶ Réécouter le document audio', 'Enregistrement diffusé une seule fois dans cette simulation.']) {
            if (!js.includes(marker)) throw new Error('Missing mock/audio behavior: ' + marker);
          }
          if (!css.includes('.language-exam-cover') || !css.includes('.mock-recording-controls')) throw new Error('Missing responsive visual styles');
          console.log('Selected exam, illustrations, oral recording and audio playback checks passed');
          NODE
      - name: Check HeyGen audio migration and administrator playback controls
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const fn = fs.readFileSync('supabase/functions/sync-language-audio/index.ts', 'utf8');
          for (const marker of ['id="sync-language-audio"', 'sync-language-audio', 'Copier les audios HeyGen dans Supabase Storage']) {
            if (!html.includes(marker) && !app.includes(marker)) throw new Error('Missing audio import UI: ' + marker);
          }
          for (const marker of ['SUPABASE_SERVICE_ROLE_KEY', 'auth.getUser()', 'profile?.role !== "admin"', 'resource2.heygen.ai', 'admin.storage.from("language-media").upload', 'update({ audio_path: storagePath })']) {
            if (!fn.includes(marker)) throw new Error('Missing secure audio migration behavior: ' + marker);
          }
          for (const marker of ['const singlePlay = inMock && activeSkill === "Compréhension orale"', 'audio.controls = false', '▶ Réécouter le document audio']) {
            if (!app.includes(marker)) throw new Error('Missing listening playback behavior: ' + marker);
          }
          console.log('Secure HeyGen audio migration, training replay and mock single-play behavior validated');
          NODE
      - name: Check interactive QCM practice and production task coverage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          for (const id of ['training-questions', 'training-answer', 'correct-training-answer']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing practice element: ' + id);
          }
          for (const marker of ['gradePracticeQuestionSet', 'language_exercise_questions', 'grade-language-attempt', 'question_ids: questions.map', 'getProductionTaskCoverage', 'productionCoverage.complete', 'const hasSectionA = ']) {
            if (!js.includes(marker)) throw new Error('Missing learning/exam behavior: ' + marker);
          }
          if (!js.includes('Réponse attendue : ') || !js.includes('Explication : ')) throw new Error('Missing detailed QCM correction output');
          if (!css.includes('.practice-qcm-form') || !css.includes('.practice-qcm-result')) throw new Error('Missing QCM practice styles');
          console.log('Interactive QCM, saved corrections and production task coverage checks passed');
          NODE
      - name: Check full-length mixed-level mock exam coverage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'const mixedLevelMock = inMock && isQcm',
            'exerciseQuery.in("level", ["B2", "C1", "C2"])',
            'count:39,minutes:35',
            'count:39,minutes:60',
            'count:40,minutes:40',
            'count:40,minutes:60',
            'questions B2–C2'
          ];
          for (const item of required) {
            if (!app.includes(item) && !html.includes(item)) throw new Error('Missing full mock coverage behavior: ' + item);
          }
          if (!html.includes('<option selected>B2</option><option>C1</option><option>C2</option>')) {
            throw new Error('Mock exam level selector is not restricted to the available B2-C2 bank');
          }
          console.log('TCF 39-question and TEF 40-question full mock settings validated');
          NODE
      - name: Check AI correction fallback configuration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fn = fs.readFileSync('supabase/functions/language-coach/index.ts', 'utf8');
          for (const model of ['gemini-3.5-flash-lite', 'gemini-3.6-flash', 'gemini-3.8-flash']) {
            if (!fn.includes(model)) throw new Error('Missing supported Gemini fallback: ' + model);
          }
          for (const legacy of ['"gemini-2.5-flash"', '"gemini-2.5-flash-lite"']) {
            if (fn.includes(legacy)) throw new Error('Legacy Gemini model must not be configured: ' + legacy);
          }
          for (const marker of ['for (let attempt = 0; attempt < 2; attempt++)', 'response.status === 401', '[429, 500, 502, 503, 504].includes(response.status)']) {
            if (!fn.includes(marker)) throw new Error('Missing AI reliability behavior: ' + marker);
          }
          if (!fn.includes('Bearer' + String.fromCharCode(92) + 's+')) throw new Error('Missing bearer-token validation');
          console.log('Gemini model fallback, transient retries and authorization checks passed');
          NODE
      - name: Check Cloudflare Worker deployment configuration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const ignore = fs.readFileSync('.assetsignore', 'utf8');
          if (config.name !== 'canadacase') throw new Error('Cloudflare Worker name must be canadacase');
          if (config.assets?.directory !== '.') throw new Error('Cloudflare assets directory must be repository root');
          if (pkg.devDependencies?.wrangler !== '4.68.0') throw new Error('Wrangler must remain pinned to the verified version');
          if (!pkg.scripts?.deploy?.includes('wrangler deploy')) throw new Error('Missing Wrangler deploy script');
          for (const entry of ['.github/', 'supabase/', 'node_modules/', 'package.json', 'wrangler.jsonc']) {
            if (!ignore.includes(entry)) throw new Error('Missing Cloudflare asset exclusion: ' + entry);
          }
          for (const asset of ['index.html', 'assets/config.js', 'assets/app.js', 'assets/style.css']) {
            if (!fs.existsSync(asset)) throw new Error('Missing public asset: ' + asset);
          }
          console.log('Cloudflare Worker config and public asset exclusions passed');
          NODE
      - name: Dry-run Cloudflare static asset deployment
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run deploy -- --dry-run
      - name: Check secure candidate and admin document preview/download
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'function closeDocumentPreview()',
            'async function openDocumentPreview(storagePath, fileName, mimeType)',
            'setAttribute("aria-modal", "true")',
            'event.key === "Escape"',
            'createSignedUrl(storagePath, 600)',
            'type === "application/pdf"',
            'type.startsWith("image/")',
            'L’aperçu intégré n’est pas disponible pour ce format.',
            'window.location.assign(result.signedUrl)',
            'openDocumentPreview(d.storage_path, d.file_name, d.mime_type)',
            'openDocumentPreview(doc.storage_path, doc.file_name, doc.mime_type)',
            '.select("id,category,file_name,storage_path,mime_type,size_bytes,status,created_at")',
            '.select("id,category,file_name,storage_path,mime_type,size_bytes,status,created_at,candidate_case_id")'
          ];
          for (const marker of required) {
            if (!app.includes(marker)) throw new Error('Missing document preview/download behavior: ' + marker);
          }
          for (const selector of ['.document-preview-overlay', '.document-preview-dialog', '.document-preview-frame', '.document-preview-image']) {
            if (!css.includes(selector)) throw new Error('Missing preview style: ' + selector);
          }
          for (const asset of ['assets/app.js?v=20261115-11', 'assets/style.css?v=20261115-11']) {
            if (!html.includes(asset)) throw new Error('Missing cache-busted asset reference: ' + asset);
          }
          console.log('Candidate/admin PDF and image preview, temporary links, download fallback, close controls and responsive styles validated');
          NODE
      - name: Check reading document visibility and grouped audio questions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          for (const marker of ['questionsByExercise', 'exerciseOrder.flatMap', 'skill==="Compréhension écrite"', 'sourceBody.textContent=exercise.prompt', 'renderExamQuestion(question, index, exerciseMap.get(question.exercise_id), seen, skill)']) {
            if (!js.includes(marker)) throw new Error('Missing mock exam document/audio grouping: ' + marker);
          }
          if (!css.includes('.exam-source-text')) throw new Error('Missing readable document styles');
          console.log('Reading documents and grouped audio questions checks passed');
          NODE
      - name: Check client workspace navigation and dashboard
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const css = fs.readFileSync('assets/style.css', 'utf8');
          for (const marker of ['id="client-dashboard"', 'data-client-nav="dashboard"', 'data-client-nav="immigration"', 'data-client-nav="documents"', 'data-client-nav="tracking"', 'data-client-nav="language"', 'data-client-nav="security"', 'data-client-section="documents"', 'data-client-section="tracking"', 'data-client-section="language"']) {
            if (!html.includes(marker)) throw new Error('Missing client workspace structure: ' + marker);
          }
          for (const marker of ['function setClientSection(section)', 'candidateView.dataset.clientSection = section', 'setClientSection(workspace === "language" ? "language" : "dashboard")', 'setClientSection(activeWorkspace === "language" ? "language" : "dashboard")']) {
            if (!app.includes(marker)) throw new Error('Missing client navigation behavior: ' + marker);
          }
          for (const selector of ['.client-space-nav', '.client-dashboard-grid', '.client-dashboard-card', '#candidate-view[data-client-section="documents"]']) {
            if (!css.includes(selector)) throw new Error('Missing client workspace style: ' + selector);
          }
          for (const asset of ['assets/app.js?v=20261115-11', 'assets/style.css?v=20261115-11']) {
            if (!html.includes(asset)) throw new Error('Missing updated cache-busted asset: ' + asset);
          }
          console.log('Client dashboard, section navigation, responsive layout and cache-busting validated');
          NODE
